name: Fearprime

on:
  push:
    paths:
      - "plugins/fearprime/**"
      - ".github/workflows/fearprime.yml"
  pull_request:
    paths:
      - "plugins/fearprime/**"
      - ".github/workflows/fearprime.yml"

jobs:
  app-quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugins/fearprime/app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.6"

      - name: Install dependencies
        run: bun install

      - name: Nuxt prepare
        run: bunx nuxt prepare

      - name: Typecheck
        run: bunx nuxi typecheck

      - name: Generate
        run: bun run generate

  domain-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.6"

      - name: Install root dependencies
        run: bun install

      - name: Run Vitest
        run: bunx vitest run plugins/fearprime/tests
