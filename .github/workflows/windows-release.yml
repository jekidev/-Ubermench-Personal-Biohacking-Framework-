name: windows-release

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/windows-release.yml"
      - "app/**"
      - "pages/**"
      - "plugins/**"
      - "public/**"
      - "server/**"
      - "src-tauri/**"
      - "nuxt.config.ts"
      - "package.json"
      - "package-lock.json"

concurrency:
  group: windows-release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  windows-release:
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: clippy,rustfmt

      - name: Install Node dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Lock Rust dependencies for this run
        working-directory: src-tauri
        run: cargo generate-lockfile

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.toml', 'src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Unit tests
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Rust tests
        working-directory: src-tauri
        env:
          RUST_BACKTRACE: "1"
        run: cargo test --all-targets --locked

      - name: Rust clippy
        working-directory: src-tauri
        env:
          RUST_BACKTRACE: "1"
        run: cargo clippy --all-targets --all-features --locked -- -D warnings

      - name: Tauri production build
        env:
          RUST_BACKTRACE: "1"
        run: npx --yes @tauri-apps/cli@^2 build --ci

      - name: Upload Windows installers
        uses: actions/upload-artifact@v4
        with:
          name: ubermench-windows-installers
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
