name: quality

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      # Tauri's Linux Rust crates (GTK/GLib/WebKitGTK) require native
      # development libraries. Install and verify the pkg-config metadata
      # explicitly so cargo never starts with a half-configured GTK stack.
      - name: Install Linux dependencies for Tauri
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            pkg-config \
            pkgconf \
            curl \
            wget \
            file \
            libssl-dev \
            libgtk-3-dev \
            libglib2.0-dev \
            libgobject-2.0-dev \
            libgdk-pixbuf-2.0-dev \
            libsoup-3.0-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev

          echo "PKG_CONFIG_PATH=/usr/lib/x86_64-linux-gnu/pkgconfig:/usr/lib/pkgconfig:/usr/share/pkgconfig" >> "$GITHUB_ENV"
          export PKG_CONFIG_PATH="/usr/lib/x86_64-linux-gnu/pkgconfig:/usr/lib/pkgconfig:/usr/share/pkgconfig"

          command -v pkg-config
          pkg-config --version
          test -f /usr/lib/x86_64-linux-gnu/pkgconfig/glib-2.0.pc
          test -f /usr/lib/x86_64-linux-gnu/pkgconfig/gobject-2.0.pc
          pkg-config --modversion glib-2.0
          pkg-config --modversion gobject-2.0
          pkg-config --cflags --libs 'glib-2.0 >= 2.70'
          pkg-config --cflags --libs 'gobject-2.0 >= 2.70'

      - name: Clear npm cache
        run: npm cache clean --force

      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund --no-package-lock

      - name: Unit tests
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Nuxt build
        run: npm run build

      - name: Rust check
        working-directory: src-tauri
        env:
          PKG_CONFIG_ALLOW_SYSTEM_CFLAGS: "1"
        run: cargo check
