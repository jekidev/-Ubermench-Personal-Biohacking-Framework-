name: quality

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: clippy,rustfmt

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install Linux dependencies for Tauri
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config pkgconf curl wget file libssl-dev \
            libgtk-3-dev libglib2.0-dev libgdk-pixbuf-2.0-dev libsoup-3.0-dev \
            libwebkit2gtk-4.1-dev libjavascriptcoregtk-4.1-dev \
            libayatana-appindicator3-dev librsvg2-dev libxdo-dev
          echo "PKG_CONFIG_PATH=/usr/lib/x86_64-linux-gnu/pkgconfig:/usr/lib/pkgconfig:/usr/share/pkgconfig" >> "$GITHUB_ENV"
          pkg-config --modversion glib-2.0
          pkg-config --modversion gobject-2.0
          pkg-config --modversion gtk+-3.0
          pkg-config --modversion webkit2gtk-4.1
          pkg-config --modversion javascriptcoregtk-4.1
          pkg-config --modversion libsoup-3.0

      # The repository's lockfile currently contains only the root package
      # metadata, so npm ci would reject it. npm install resolves the complete
      # dependency graph until a fully generated lockfile is committed.
      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Unit tests
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Nuxt build
        run: npm run build

      - name: Rust format check
        working-directory: src-tauri
        run: cargo fmt --all -- --check

      - name: Rust tests
        working-directory: src-tauri
        env:
          PKG_CONFIG_ALLOW_SYSTEM_CFLAGS: "1"
          RUST_BACKTRACE: "1"
        run: cargo test --all-targets

      - name: Rust check
        working-directory: src-tauri
        env:
          PKG_CONFIG_ALLOW_SYSTEM_CFLAGS: "1"
          RUST_BACKTRACE: "1"
        run: cargo check --all-targets

      - name: Rust clippy
        working-directory: src-tauri
        env:
          PKG_CONFIG_ALLOW_SYSTEM_CFLAGS: "1"
          RUST_BACKTRACE: "1"
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Tauri CLI smoke test
        run: npx --yes @tauri-apps/cli@^2 info

      - name: Tauri production build
        env:
          PKG_CONFIG_ALLOW_SYSTEM_CFLAGS: "1"
          RUST_BACKTRACE: "1"
        run: npx --yes @tauri-apps/cli@^2 build --ci
