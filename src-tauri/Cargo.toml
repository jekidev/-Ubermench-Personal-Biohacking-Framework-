[package]
name = "ubermench"
version = "0.1.0"
description = "Ubermench Personal Biohacking Framework desktop shell"
authors = ["jekidev"]
edition = "2021"

[lib]
name = "ubermench_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2" }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
base64 = "0.22"
pdf-extract = "0.12"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
